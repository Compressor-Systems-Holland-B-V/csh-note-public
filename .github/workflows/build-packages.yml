# Builds packages without releasing anything
#
# Push a tag naming the packages you want, dash separated:
#
#   git tag build-pkg-deb && git push origin build-pkg-deb
#   git tag build-pkg-rpm-exe && git push origin build-pkg-rpm-exe
#   git tag build-pkg-all && git push origin build-pkg-all
#
# A push to main that changes the rust dependencies also builds every package.
# Caches saved on a tag are visible only to that tag, so this is what leaves a
# warm cargo cache on main for the release and build-pkg-* tags to restore.

name: build packages

on:
  push:
    tags: ['build-pkg-*']
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - vendor/zsuite
  workflow_dispatch:
    inputs:
      targets:
        description: 'Packages to build, comma separated, or "all"'
        type: string
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  choose:
    name: read the requested packages
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - name: Parse the tag or the dispatch input
        id: parse
        env:
          DISPATCH_TARGETS: ${{ github.event.inputs.targets }}
        run: |
          all='["deb","rpm","arch","exe","dmg"]'

          if [ -n "${DISPATCH_TARGETS:-}" ]; then
            raw="$(echo "$DISPATCH_TARGETS" | tr ',' ' ')"
          elif [ "$GITHUB_REF_TYPE" = branch ]; then
            raw=all
          else
            # build-pkg-rpm-exe becomes "rpm exe"
            raw="$(echo "${GITHUB_REF_NAME#build-pkg-}" | tr '-' ' ')"
          fi

          if echo " $raw " | grep -q ' all '; then
            targets="$all"
          else
            targets="$(printf '%s\n' $raw | jq -R . | jq -sc .)"
          fi

          if [ "$targets" = '[]' ]; then
            echo "no packages named, use build-pkg-all or build-pkg-deb-rpm" >&2
            exit 1
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "building $targets"

  packages:
    needs: choose
    uses: ./.github/workflows/package-build.yml
    with:
      targets: ${{ needs.choose.outputs.targets }}
