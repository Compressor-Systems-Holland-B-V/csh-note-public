# Builds one installable package per matrix entry.

name: package build

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of package names, for example ["deb","exe"]'
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Turn the target names into matrix entries
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cat > catalog.json <<'JSON'
          {
            "deb":  { "name": "deb",  "os": "ubuntu-24.04",   "kind": "tauri", "rust": true, "bundle": "deb",  "glob": "src-tauri/target/release/bundle/deb/*.deb" },
            "rpm":  { "name": "rpm",  "os": "ubuntu-24.04",   "kind": "tauri", "rust": true, "bundle": "rpm",  "glob": "src-tauri/target/release/bundle/rpm/*.rpm" },
            "exe":  { "name": "exe",  "os": "windows-latest", "kind": "tauri", "rust": true, "bundle": "nsis", "glob": "src-tauri/target/release/bundle/nsis/*-setup.exe" },
            "dmg":  { "name": "dmg",  "os": "macos-14",       "kind": "tauri", "rust": true, "bundle": "dmg",  "glob": "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" },
            "msix": { "name": "msix", "os": "windows-latest", "kind": "msix",  "rust": true, "glob": "dist/packages/*.msix" },
            "arch": { "name": "arch", "os": "ubuntu-24.04",   "kind": "arch",  "glob": "dist/packages/*.pkg.tar.zst" }
          }
          JSON

          unknown="$(jq -r --argjson want "$TARGETS" '. as $c | [$want[] | select($c[.] == null)] | join(", ")' catalog.json)"
          if [ -n "$unknown" ]; then
            echo "unknown package targets: $unknown" >&2
            jq -r '"known targets: " + (keys | join(", "))' catalog.json >&2
            exit 1
          fi

          matrix="$(jq -c --argjson want "$TARGETS" '. as $c | [$want[] | $c[.]]' catalog.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "building: $matrix"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version being built
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # arch brings its own toolchain inside the container sandbox
      - uses: pnpm/action-setup@v4
        if: matrix.rust

      - uses: actions/setup-node@v4
        if: matrix.rust
        with:
          node-version: '24'
          cache: pnpm

      - name: Install the libraries tauri builds against
        if: startsWith(matrix.os, 'ubuntu') && matrix.rust
        timeout-minutes: 15
        uses: ./.github/actions/apt-deps
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev
            libayatana-appindicator3-dev file
            ${{ matrix.bundle == 'rpm' && 'rpm' || '' }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust

      - name: Add the apple targets
        if: matrix.bundle == 'dmg'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache the cargo registry and build
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: pkg-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: pkg-${{ matrix.name }}-${{ runner.os }}-

      # the cache carries src-tauri/target, where tauri also writes its packages
      - name: Drop any packages the cache restored
        if: matrix.rust
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle \
                 src-tauri/target/universal-apple-darwin/release/bundle

      - name: Install the node packages
        if: matrix.rust
        run: pnpm install --frozen-lockfile

      # deb, rpm and exe. --bundles overrides bundle.targets in tauri.conf.json

      - name: Build the ${{ matrix.name }} package
        if: matrix.kind == 'tauri' && matrix.bundle != 'dmg'
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      # dmg, one image covering apple silicon and intel

      - name: Build the universal macos disk image
        if: matrix.bundle == 'dmg'
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Build the msix package
        if: matrix.kind == 'msix'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'

          pnpm tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

          $layout = 'dist/msix'
          New-Item -ItemType Directory -Force -Path "$layout/Assets", 'dist/packages' | Out-Null

          Copy-Item 'src-tauri/target/release/znote.exe' $layout

          foreach ($logo in 'StoreLogo', 'Square44x44Logo') {
            Copy-Item "src-tauri/icons/$logo.png" "$layout/Assets"
          }

          # the start tiles are opaque, built by tools/icon/msix-tiles.py
          Copy-Item 'packaging/msix/Assets/*.png' "$layout/Assets"

          $manifest = Get-Content 'packaging/msix/AppxManifest.xml.in' -Raw
          $manifest.Replace('@VERSION@', "$env:VERSION.0") |
            Set-Content "$layout/AppxManifest.xml" -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter makeappx.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object { $_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $makeappx) { throw 'no makeappx.exe in the windows sdk on this runner' }
          Write-Output "packing with $($makeappx.FullName)"

          & $makeappx.FullName pack /d $layout /p "dist/packages/znote-$env:VERSION-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }

      # arch, built from the checkout so untagged commits package too

      - name: Build the arch package
        if: matrix.kind == 'arch'
        run: |
          mkdir -p dist/packages dist/arch/repo
          git archive HEAD | tar -x -C dist/arch/repo
          version="$(node -p 'require("./package.json").version')"
          sed -e 's|^source=.*|source=()|' \
              -e '/^sha256sums=/d' \
              -e "s|^pkgver=.*|pkgver=$version|" \
              -e 's|cd "$srcdir/$pkgname-$pkgver"|cd "$startdir/repo"|' \
              packaging/arch/PKGBUILD > dist/arch/PKGBUILD
          docker run --rm -v "$PWD/dist/arch:/build" -w /build archlinux:base-devel bash -eux -c "
            pacman -Syu --noconfirm --needed rust nodejs pnpm webkit2gtk-4.1 gtk3 openssl
            useradd -m builder
            chown -R builder /build
            su builder -c 'makepkg --noconfirm --nodeps'
          "
          cp dist/arch/*.pkg.tar.zst dist/packages/

      - name: Collect the package
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "no ${{ matrix.name }} package was produced" >&2
            exit 1
          fi
          cp "${files[@]}" out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
