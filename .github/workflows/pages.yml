# Deploys packaging/repo/html, the download page, to github pages.
# scripts/publish.sh --pages regenerates it from a release.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'packaging/repo/html/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check there is a page to deploy
        run: |
          if [ ! -f packaging/repo/html/index.html ]; then
            echo "packaging/repo/html/index.html is missing, run scripts/publish.sh --pages" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo/html

      - id: deploy
        uses: actions/deploy-pages@v4
