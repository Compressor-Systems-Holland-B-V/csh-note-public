# Runs the svelte type check, vitest and the frontend build, then rust
# formatting, clippy and the rust tests.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the release runs the same checks before it publishes anything
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # the version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install the node packages
        run: pnpm install --frozen-lockfile

      - name: Type check the frontend
        run: pnpm check

      - name: Run the frontend tests
        run: pnpm test

      - name: Build the frontend
        run: pnpm build

  rust:
    name: rust checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # only what pkg-config needs to resolve the tauri crate
      - name: Install the libraries tauri builds against
        timeout-minutes: 10
        uses: ./.github/actions/apt-deps
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install the node packages
        run: pnpm install --frozen-lockfile

      # tauri_build reads src-tauri/dist, which is not in the repo
      - name: Build the frontend
        run: pnpm build

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache the cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint the rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run the rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
