# Cuts a github release from a v1.2.3 tag.
#
#   1. runs the ci checks and builds every package in a matrix
#   2. signs every package with the maintainer's OpenPGP key, writes its
#      sha256 and records a build provenance attestation for it
#   3. creates the release, with the changelog entry and every package attached
#   4. publishes the crate to crates.io
#   5. repoints the download page at the release
#
# Each package ships with two files next to it:
#
#   <package>.asc     detached OpenPGP signature, proves who published it
#   <package>.sha256  its checksum, proves it arrived intact
#
# The signing key is the signing subkey 8FF8C58AFB01414B44665A75766F98D6FFDE4523
# (expires 2028-09-26) of Arsalan Anwari's key, primary fingerprint
# $SIGNING_KEY below. Export only the subkey into the secret, so the primary
# key never leaves the maintainer's machine:
#
#   gpg --armor --export-secret-subkeys 8FF8C58AFB01414B44665A75766F98D6FFDE4523! > signing-subkey.asc
#   gh secret set GPG_PRIVATE_KEY --repo ZAL-Analytics/znote < signing-subkey.asc
#   gh secret set GPG_PASSPHRASE --repo ZAL-Analytics/znote
#   shred -u signing-subkey.asc
#
# The public key must be where the README tells users to fetch it. After any
# change to the key (new subkey, new expiry, new user id) publish it again:
#
#   gpg --armor --export 88A9AE5871B9A36EE3305977829EFCCDE81402E6    # paste into github, settings, SSH and GPG keys
#   gpg --keyserver hkps://keys.openpgp.org --send-keys 88A9AE5871B9A36EE3305977829EFCCDE81402E6
#
# keys.openpgp.org serves a key without its user ids until the email address
# is confirmed, and gpg refuses to import such a key. A new address has to be
# confirmed once through https://keys.openpgp.org/upload.
#
# Other secrets: CARGO_REGISTRY_TOKEN publishes the crate.
#
# There is no Microsoft Store package. Releases are the github release and the
# download page only; anyone who wants a store listing builds it from a fork.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.5.1). The tag must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  packages:
    uses: ./.github/workflows/package-build.yml
    with:
      targets: '["deb","rpm","arch","exe","dmg"]'

  release:
    name: publish the release
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # the build provenance attestation
      id-token: write
      attestations: write
    env:
      SIGNING_KEY: 88A9AE5871B9A36EE3305977829EFCCDE81402E6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.VERSION }}

      - name: Check the tag matches the version the packages carry
        run: |
          built="$(node -p "require('./package.json').version")"
          if [ "v$built" != "$VERSION" ]; then
            echo "releasing $VERSION but package.json says $built, run scripts/update_version.sh first" >&2
            exit 1
          fi

      - name: Collect every package
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: staging
          merge-multiple: true

      # github turns spaces in asset names into dots on upload, so do it here,
      # otherwise the names inside the .sha256 files would not match the downloads
      - name: Name the packages the way github will
        run: |
          cd staging
          for f in *' '*; do
            [ -e "$f" ] && mv -- "$f" "${f// /.}"
          done
          ls -l

      - name: Record where each package was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*

      - name: Sign every package and write its checksum
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "no GPG_PRIVATE_KEY secret, see the top of release.yml, stopping" >&2
            exit 1
          fi

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if ! gpg --batch --with-colons --list-secret-keys | grep -q "^fpr:*$SIGNING_KEY:"; then
            echo "GPG_PRIVATE_KEY does not belong to $SIGNING_KEY, stopping" >&2
            exit 1
          fi

          cd staging
          for f in *; do
            sha256sum -- "$f" > "$f.sha256"
            printf '%s' "${GPG_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$SIGNING_KEY" \
              --armor --detach-sign --output "$f.asc" -- "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
          rm -rf "$GNUPGHOME"
          ls -l

      - name: Read the changelog entry for this tag
        run: |
          version="${VERSION#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found && !/^\[[^][]*\]: / { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for $version, stopping" >&2
            exit 1
          fi

          {
            echo
            echo '## Verifying the downloads'
            echo
            echo 'Every package has a `.asc` signature and a `.sha256` checksum next to it.'
            echo 'See [Verifying a download](https://github.com/${{ github.repository }}#verifying-a-download) for the steps.'
            echo
            echo '```'
            cat staging/*.sha256
            echo '```'
            echo
            echo "Signed with OpenPGP key \`$SIGNING_KEY\`."
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "znote ${VERSION#v}" \
            --notes-file notes.md \
            --verify-tag \
            staging/*

  crates:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.VERSION }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # no --verify: it compiles the whole app, which needs the gtk and webkit
      # headers this job does not install. scripts/publish.sh --dry-run covers it
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::no CARGO_REGISTRY_TOKEN secret, the crate was not published"
            exit 0
          fi
          scripts/publish.sh --no-verify

  download-page:
    name: repoint the download page
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main

      - name: Rebuild the download page from the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh --pages "$VERSION"

      # a push made with the workflow token starts no workflows, so pages is triggered by hand below
      - name: Commit it
        run: |
          if [ -z "$(git status --porcelain -- packaging/repo/html)" ]; then
            echo "the download page already points at $VERSION"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packaging/repo/html
            git commit -m "Point the download page at $VERSION"
            git push origin main
          fi

      - name: Deploy the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
