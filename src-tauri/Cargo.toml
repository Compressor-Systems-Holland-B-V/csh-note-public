[package]
name = "znote"
# 0.1.0 is already published on crates.io
version = "0.2.0"
description = "A lightweight desktop editor for Typst with live preview, built with Tauri"
license = "Apache-2.0"
repository = "https://github.com/ZAL-Analytics/znote"
readme = "../README.md"
keywords = ["typst", "editor", "tauri"]
categories = ["text-editors"]
edition = "2024"
# dist/ is the gitignored frontend build; listing it here ships it in the crate so `cargo install` works
include = ["src/**", "build.rs", "tauri.conf.json", "capabilities/**", "icons/**", "dist/**"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "znote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
