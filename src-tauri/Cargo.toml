[package]
name = "znote"

version = "1.1.0"
description = "A lightweight desktop editor for Typst with live preview, built with Tauri"
license = "Apache-2.0"
repository = "https://github.com/ZAL-Analytics/znote"
readme = "../README.md"
keywords = ["typst", "editor", "tauri"]
categories = ["text-editors"]
edition = "2024"
# dist/ is the gitignored frontend build; listing it here ships it in the crate so `cargo install` works
include = ["src/**", "resources/**", "build.rs", "tauri.conf.json", "capabilities/**", "icons/**", "dist/**"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "znote_lib"
# Only the desktop binary links this. staticlib and cdylib are for mobile and each cost a
# full LTO link of the whole app on every release build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
trash = "5"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
zsuite-theme = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-theme" }
zsuite-veil = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-veil", features = ["typst"] }
zsuite-finder = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-finder" }
zsuite-typst = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-typst" }
zsuite-sealed = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-sealed", features = ["typst"] }
zsuite-agent = { version = "0.1.0", path = "../vendor/zsuite/crates/zsuite-agent" }
tauri-plugin-zsuite-assistant = { version = "0.1.0", path = "../vendor/zsuite/crates/tauri-plugin-zsuite-assistant" }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# codegen-units stays at the default: with lto the binary is barely larger, and a single
# unit per crate made the Windows release build take most of an hour.
[profile.release]
lto = true
opt-level = 3
strip = true

[[test]]
name = "versions"
path = "../test/versions.rs"
