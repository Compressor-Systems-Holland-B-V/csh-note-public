[package]
name = "znote"

version = "1.0.0"
description = "A lightweight desktop editor for Typst with live preview, built with Tauri"
license = "Apache-2.0"
repository = "https://github.com/ZAL-Analytics/znote"
readme = "../README.md"
keywords = ["typst", "editor", "tauri"]
categories = ["text-editors"]
edition = "2024"
# dist/ is the gitignored frontend build; listing it here ships it in the crate so `cargo install` works
include = ["src/**", "resources/**", "build.rs", "tauri.conf.json", "capabilities/**", "icons/**", "dist/**"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "znote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
trash = "5"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
typst-html = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
zsuite-theme = { path = "../vendor/zsuite/crates/zsuite-theme" }
lopdf = { version = "0.45.0", default-features = false }
roxmltree = "0.21"
aho-corasick = "1"
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
oxrdfio = "0.2"
oxrdf = "0.3"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries"] }
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# No features: its regex features also turn on tokenizers' C++ esaxx, built with the static CRT,
# which clashes with onnxruntime's dynamic CRT when linking on Windows. tokenizers above
# supplies fancy-regex.
model2vec-rs = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[[test]]
name = "versions"
path = "../test/versions.rs"
